<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="title desc">
  <title id="title">Flujo mensual de pagos a los inversionistas</title>
  <desc id="desc">Animación de cinco pasos: orden de depósito, pago de la cuota, validación completa, pendiente de distribución y distribución a los inversionistas.</desc>
  <style>
    :root { color-scheme: light; }
    .step { opacity: .28; }
    .s1 { animation: pulse 8s infinite 0s; }
    .s2 { animation: pulse 8s infinite 1.4s; }
    .s3 { animation: pulse 8s infinite 2.8s; }
    .s4 { animation: pulse 8s infinite 4.2s; }
    .s5 { animation: pulse 8s infinite 5.6s; }
    .line { opacity: .22; }
    @keyframes pulse {
      0%, 10% { opacity: .28; transform: translateX(0); }
      16%, 30% { opacity: 1; transform: translateX(2px); }
      36%, 100% { opacity: .28; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .step { animation: none !important; opacity: 1; }
    }
  </style>

  <rect width="360" height="640" rx="22" fill="#FAFAF7"/>

  <text x="18" y="34" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="800" fill="#252A2B">Cómo serán los pagos</text>
  <text x="18" y="62" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="800" fill="#252A2B">a los inversionistas</text>
  <text x="18" y="94" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#687171">Cada cuota sigue un flujo mensual.</text>

  <g class="step s1">
    <rect x="18" y="126" width="324" height="76" rx="16" fill="#FFFFFF" stroke="#DDE2E2"/>
    <circle cx="47" cy="164" r="17" fill="#0086FF"/>
    <text x="47" y="170" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">1</text>
    <text x="76" y="170" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#252A2B">Orden de depósito</text>
  </g>
  <line class="line" x1="180" y1="202" x2="180" y2="222" stroke="#0086FF" stroke-width="3"/>

  <g class="step s2">
    <rect x="18" y="222" width="324" height="76" rx="16" fill="#FFFFFF" stroke="#DDE2E2"/>
    <circle cx="47" cy="260" r="17" fill="#0086FF"/>
    <text x="47" y="266" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">2</text>
    <text x="76" y="266" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#252A2B">Pago de la cuota</text>
  </g>
  <line class="line" x1="180" y1="298" x2="180" y2="318" stroke="#0086FF" stroke-width="3"/>

  <g class="step s3">
    <rect x="18" y="318" width="324" height="76" rx="16" fill="#FFFFFF" stroke="#DDE2E2"/>
    <circle cx="47" cy="356" r="17" fill="#0086FF"/>
    <text x="47" y="362" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
    <text x="76" y="362" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#252A2B">Validación completa</text>
  </g>
  <line class="line" x1="180" y1="394" x2="180" y2="414" stroke="#0086FF" stroke-width="3"/>

  <g class="step s4">
    <rect x="18" y="414" width="324" height="76" rx="16" fill="#FFFFFF" stroke="#DDE2E2"/>
    <circle cx="47" cy="452" r="17" fill="#0086FF"/>
    <text x="47" y="458" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">4</text>
    <text x="76" y="458" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#252A2B">Pendiente de distribución</text>
  </g>
  <line class="line" x1="180" y1="490" x2="180" y2="510" stroke="#0086FF" stroke-width="3"/>

  <g class="step s5">
    <rect x="18" y="510" width="324" height="76" rx="16" fill="#FFFFFF" stroke="#DDE2E2"/>
    <circle cx="47" cy="548" r="17" fill="#0086FF"/>
    <text x="47" y="554" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">5</text>
    <text x="76" y="542" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#252A2B">Distribución a</text>
    <text x="76" y="564" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="800" fill="#252A2B">inversionistas</text>
  </g>

  <text x="18" y="614" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="800" fill="#252A2B">Frecuencia: mensual</text>
  <text x="18" y="634" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#687171">Validación antes de distribuir.</text>
</svg>