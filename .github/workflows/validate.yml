name: Validar enlaces y fichas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install metadata dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Run share-link, control and source-preservation tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript and isolated control states
        run: |
          for file in assets/js/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Generate shared catalog and public maintenance projection
        run: |
          python scripts/build_share_catalog.py
          python scripts/build_maintenance_control.py
      - name: Validate Jekyll rendering
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate canonical routes and reachability
        run: |
          python scripts/check_fr_navigation.py _site
          python scripts/verify_maintenance_site.py _site
          python scripts/check_site_integrity.py _site
      - name: Prepare isolated category and role fixture
        run: python scripts/check_category_navigation.py prepare _navigation-fixture
      - name: Render isolated category and role fixture
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_navigation-fixture
          destination: ./_navigation-fixture-site
      - name: Verify generic category and role navigation
        run: python scripts/check_category_navigation.py verify _navigation-fixture-site
      - name: Install browser testing dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test desktop, mobile, keyboard and no-JavaScript navigation
        run: python scripts/smoke_fr_navigation.py _site
      - name: Test another category and role in mobile navigation
        run: python scripts/check_category_navigation.py smoke _navigation-fixture-site
      - name: Test role-local search and section filters
        run: python scripts/smoke_fr_explorer.py _site
      - name: Test general home and category-role-section maintenance
        run: python scripts/smoke_category_base.py _site
      - name: Test the four maintenance views and failure states
        run: python scripts/smoke_maintenance_workspace.py _site
      - name: Test refreshed design and catalog filters
        run: python scripts/smoke_visual_refresh.py _site
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-navigation-ui
          path: ui-artifacts/
          if-no-files-found: ignore
          retention-days: 7
