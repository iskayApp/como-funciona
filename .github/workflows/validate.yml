name: Validar enlaces y fichas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install metadata dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run share-link tests
        run: python -m unittest discover -s tests -v

      - name: Check public and maintenance search JavaScript
        run: |
          node --check assets/js/maintenance-search.js
          node --check assets/js/public-search.js
          node --check assets/js/guidance.js
          node --check assets/js/fr-navigation.js
          node --test tests/public-search.test.cjs tests/guidance.test.cjs

      - name: Generate and validate share catalog
        run: python scripts/build_share_catalog.py

      - name: Validate Jekyll rendering
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate FR navigation against all canonical pages
        run: python scripts/check_fr_navigation.py _site

      - name: Install browser testing dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium

      - name: Test desktop, mobile, keyboard and no-JavaScript navigation
        run: python scripts/smoke_fr_navigation.py _site

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-navigation-ui
          path: ui-artifacts/
          if-no-files-found: ignore
          retention-days: 7
