name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install maintenance dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Generate maintenance report
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python scripts/maintenance_check.py

      - name: Persist rotated TikTok refresh token when updater credential exists
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_UPDATE_TOKEN }}
        run: |
          if [ -f mantenimiento/tiktok_refresh_token.next ]; then
            if [ -n "$GH_TOKEN" ]; then
              gh secret set TIKTOK_REFRESH_TOKEN < mantenimiento/tiktok_refresh_token.next
              echo "TikTok refresh token rotated and repository secret was updated."
            else
              echo "::warning::TikTok returned a rotated refresh token. Add GH_SECRET_UPDATE_TOKEN to enable automatic secret rotation."
            fi
            rm -f mantenimiento/tiktok_refresh_token.next
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
