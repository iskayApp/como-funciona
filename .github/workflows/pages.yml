name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install maintenance dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Generate maintenance report
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python scripts/maintenance_check.py

      - name: Detect TikTok refresh-token rotation
        id: tiktok-rotation
        shell: bash
        run: |
          if [ -f mantenimiento/tiktok_refresh_token.next ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create temporary GitHub App token
        if: steps.tiktok-rotation.outputs.required == 'true'
        id: maintenance-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}

      - name: Persist rotated TikTok refresh token
        if: steps.tiktok-rotation.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ steps.maintenance-app-token.outputs.token }}
        shell: bash
        run: |
          gh secret set TIKTOK_REFRESH_TOKEN             --repo "$GITHUB_REPOSITORY"             < mantenimiento/tiktok_refresh_token.next

          rm -f mantenimiento/tiktok_refresh_token.next

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("mantenimiento/status.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          service = data.setdefault("services", {}).setdefault("tiktok", {})
          service["rotation_required"] = False
          detail = service.get("detail", "").rstrip()
          suffix = " Refresh token rotado y actualizado automáticamente en GitHub Secrets."
          if suffix.strip() not in detail:
              service["detail"] = (detail + suffix).strip()
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

          echo "TikTok refresh token rotated and TIKTOK_REFRESH_TOKEN was updated automatically."

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
